<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <nav class="bg-gray-200">
            <div class="flex justify-between p-8 items-center">
                <h1 class="text-4xl text-indigo-600">AppFlow</h1>
                <div class="flex gap-5 text-2xl">
                    <a href>Home</a>
                    <a href>Contact</a>
                    <a href>About</a>
                    <a href>Feature</a>
                </div>
                <button class="rounded-xl bg-white p-4 cursor-pointer"
                    onclick="showModal()">Login</button>
            </div>
        </nav>

        <div id="modal"
            class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-6 w-96 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Login</h2>
                    <button onclick="hideModal()"
                        class="text-gray-400 hover:text-gray-600 cursor-pointer">X</button>
                </div>
                <div class="flex flex-col gap-4">
                    <div>
                        <label
                            class="text-sm text-gray-600 mb-1 block">Email</label>
                        <input type="email" placeholder="Masukan email anda"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label
                            class="text-sm text-gray-600 mb-1 block">Password</label>
                        <input type="password"
                            placeholder="Masukan password anda"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <button
                        class="bg-indigo-600 text-white py-2 rounded-lg font-semi-bold hover:bg-indigo-400 cursor-pointer">Masuk</button>
                    <p class="text-center text-sm text-gray-400">Belum punya
                        akun?<a href="#"
                            class="text-indigo-600 font-semibold">Daftar</a></p>
                </div>
            </div>
        </div>
        <script src="login.js"></script>
    </body>
</html>
