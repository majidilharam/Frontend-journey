<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kasir</title>
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="flex bg-gray-500 justify-center min-h-screen items-center">
        <div class=" rounded-xl bg-white w-fit p-6 shadow-2xl">
            <h1 class="mb-6 font-bold ">Program Kasir</h1>
            <input class=" rounded-2xl border-1 p-2 mr-3" type="number"
                placeholder="input total belanja" id="belanja">
            <button
                class="rounded-2xl bg-blue-500 text-white p-2 cursor-pointer "
                id="addBtn">Hitung total</button>

            <div id="hasil"
                class=" border mt-3 p-5 rounded-2xl text-center font-bold
    text-xl">
                <p>Masukan transaksi</p>
            </div>
        </div>
        <script src="kasir.js"></script>
    </body>
</html>
